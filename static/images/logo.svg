<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 90" width="100%" height="100%">
  <defs>
    <linearGradient id="fiberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Fiber Optical Emblem -->
  <g transform="translate(10, 12)">
    <!-- Outer glow pulse circle -->
    <circle cx="34" cy="34" r="32" fill="none" stroke="url(#fiberGrad)" stroke-width="2.5" opacity="0.4" stroke-dasharray="6,4" />
    <!-- Center fiber hub -->
    <circle cx="34" cy="34" r="26" fill="#0B1120" stroke="url(#fiberGrad)" stroke-width="2" />
    <!-- WiFi wave arcs with optical dots -->
    <path d="M 18 22 A 22 22 0 0 1 50 22" fill="none" stroke="#00F2FE" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M 23 28 A 15 15 0 0 1 45 28" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
    <path d="M 28 34 A 8 8 0 0 1 40 34" fill="none" stroke="#818CF8" stroke-width="3" stroke-linecap="round"/>
    <!-- Center glowing optical core -->
    <circle cx="34" cy="42" r="4.5" fill="#00F2FE" filter="url(#glow)"/>
    <!-- Orbiting light photon -->
    <circle cx="58" cy="22" r="3" fill="#EC4899" filter="url(#glow)"/>
  </g>

  <!-- Typography: MEHRAN WIFI SERVICE -->
  <g transform="translate(90, 20)">
    <!-- Brand Title -->
    <text x="0" y="30" font-family="'Outfit', 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="900" letter-spacing="2" fill="#FFFFFF">
      MEHRAN <tspan fill="url(#fiberGrad)">WIFI</tspan>
    </text>
    <!-- Subtitle / Tagline -->
    <text x="2" y="48" font-family="'Inter', -apple-system, sans-serif" font-size="10.5" font-weight="700" letter-spacing="4" fill="#38BDF8">
      FIBER OPTIC INTERNET SERVICE
    </text>
  </g>
</svg>
